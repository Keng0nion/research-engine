[project]
name = "research-engine"
version = "0.1.0"
description = "Research Engine v2: multi-platform search, academic discovery, deep reading and evidence intelligence"
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=2.0",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[project.scripts]
researchctl = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "providers"]
